spring:
  application:
    name: helpdesk
  config:
    # Local secrets (HELPDESK_KEK, ADMIN_EMAIL, ADMIN_PASSWORD) live in backend/.env, which is gitignored.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DB_USER:helpdesk}
    password: ${DB_PASSWORD:helpdesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    # SMTP server for helpdesk.email.mode=smtp. Locally that's Mailpit (docker compose), no login.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Fail fast instead of tying up a job worker when the server is down.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        # Pages serialize as {content, page: {size, number, totalElements, totalPages}}.
        serialization-mode: via-dto

server:
  # 8090 locally because 8080 is often taken; Docker/OCI can set PORT=8080.
  port: ${PORT:8090}

management:
  # Actuator lives on its own port, never published publicly; Prometheus scrapes it over the private network.
  server:
    port: ${MANAGEMENT_PORT:8091}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  health:
    mail:
      # The mail server being down doesn't make the app unhealthy: emails wait in the outbox and
      # are retried. (Also keeps health UP when email is in log mode with no SMTP server.)
      enabled: false
  tracing:
    # Off unless Tempo is running (compose.observability.yaml), so the app doesn't log failed exports.
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      # Histogram buckets so Grafana can show p50/p95 latency.
      percentiles-histogram:
        http.server.requests: true
        helpdesk.ai.call: true

db-scheduler:
  # Tables come from Flyway; scheduler runs with a single thread pool shared by all jobs.
  threads: 4
  polling-interval: 10s
  # Run a job scheduled for "now" right away instead of waiting for the next poll.
  immediate-execution-enabled: true

helpdesk:
  auth:
    issuer: https://helpdesk.local
    audience: helpdesk-api
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    key-rotation-interval: P7D
    key-retire-buffer: PT5M
    key-encryption-key: ${HELPDESK_KEK:}
    lockout:
      max-failures: 5
      duration: PT15M
    rate-limit:
      per-ip-per-minute: 20
      per-account-per-minute: 5
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  tickets:
    auto-close-after: P7D
  ai:
    # api: Claude API with ANTHROPIC_API_KEY (blank key = AI off)
    # claude-code: local testing via the Claude Code CLI on your Claude subscription (no API billing)
    # off: no AI
    mode: ${HELPDESK_AI_MODE:api}
    api-key: ${ANTHROPIC_API_KEY:}
    claude-command: ${HELPDESK_CLAUDE_COMMAND:claude}
    claude-timeout: PT2M
    classify-model: claude-haiku-5-5
    reply-model: claude-sonnet-5-5
    max-attempts: 5
    retry-delay: PT30S
  email:
    # log: only log that an email would go out. smtp: send it (spring.mail.*).
    mode: ${HELPDESK_EMAIL_MODE:log}
    from: HelpDesk Support <support@helpdesk.local>
    max-attempts: 5
    retry-delay: PT30S
