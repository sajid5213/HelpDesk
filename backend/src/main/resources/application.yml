spring:
  application:
    name: helpdesk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DB_USER:helpdesk}
    password: ${DB_PASSWORD:helpdesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  # 8090 locally because 8080 is often taken; Docker/OCI can set PORT=8080.
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health
