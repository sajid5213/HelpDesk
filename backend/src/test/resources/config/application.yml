# Test-only values, layered over src/main/resources/application.yml. Not real secrets.
helpdesk:
  auth:
    key-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  admin:
    email: admin@helpdesk.test
    password: test-admin-password-123
  ai:
    # Fast retries so failure tests finish in seconds.
    max-attempts: 3
    retry-delay: PT0.2S
  email:
    # Tests use RecordingEmailSender; fast retries so failure tests finish quickly.
    mode: log
    max-attempts: 3
    retry-delay: PT0.2S

db-scheduler:
  polling-interval: 500ms

management:
  # Random free port, so test runs never collide with a running backend.
  server:
    port: 0
  # Tests never send traces anywhere.
  tracing:
    export:
      enabled: false
