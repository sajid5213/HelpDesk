# Single-process Tempo with local storage: enough for one app on one machine.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

backend_worker:
  compaction:
    # Keep traces for 3 days.
    block_retention: 72h

usage_report:
  reporting_enabled: false
